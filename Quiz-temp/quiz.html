<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quiz Night</title>
    <link rel="stylesheet" href="quiz.css" />
    <script src="quiz.js" defer></script>
  </head>

  <body>
    <main class="content-page" aria-label="Quiz start">
      <h1 class="title">Quiz Night</h1>
      <div class="quiz">
        <div class="status flex">
          <p class="progress"></p>
          <p class="score">Score: <span class="score-value">0</span></p>
        </div>
        <div class="question-box">
          <h2>Question textGoes here</h2>
        </div>
        <div class="options-box">
          <!--added click event-->
          <button class="option">result</button>
          <!--added click event-->
          <button class="option">result</button>
          <button class="option">result</button>
          <button class="option">result</button>
        </div>
        <div class="footer flex hidden">
          <p class="result">Correct!</p>
          <button class="btn-action" disabled>Next</button>
        </div>
      </div>
    </main>
  </body>
</html>
