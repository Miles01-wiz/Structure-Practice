<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="quiz.css" />
    <script src="quiz.js" defer></script>
  </head>
  <body>
    <section class="p-sec">
      <div class="p-div">
        <h1 class="quiz-title">Quiz Night</h1>
        <div class="top-para">
          <p class="progress"></p>
          <span>Score: 1</span>
        </div>
        <h2 class="question">Which tag creates a link in HTML?</h2>
        <div class="grid-items">
          <div>
            <button class="grid-item"><code>&lt;link&gt;</code></button>
          </div>
          <div>
            <button class="grid-item"><code>&lt;a&gt;</code></button>
          </div>
          <div>
            <button class="grid-item"><code>&lt;href&gt;</code></button>
          </div>
          <div>
            <button class="grid-item"><code>&lt;url&gt;</code></button>
          </div>
        </div>

        <div class="footer-para hidden">
          <p>Correct!</p>
          <button class="next-btn">Next</button>
        </div>
      </div>
    </section>
  </body>
</html>
